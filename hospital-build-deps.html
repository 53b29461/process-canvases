<!DOCTYPE html>

<head>

<title>病院建設・開業 &mdash; vis-network版</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eff1f5;font-family:"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:8px 14px;background:#e6e9ef;border-bottom:1px solid #ccd0da;display:flex;align-items:center;gap:10px;flex-shrink:0}
  header h1{font-size:13px;color:#1e66f5}
  .controls{display:flex;gap:6px;margin-left:auto}
  .controls button{background:#e6e9ef;border:1px solid #bcc0cc;color:#4c4f69;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px}
  .controls button:hover{background:#dce0e8}
  .hint{font-size:11px;color:#9ca0b0}
  .legend{display:flex;gap:10px;padding:5px 14px;background:#e6e9ef;border-bottom:1px solid #ccd0da;flex-shrink:0;flex-wrap:wrap;align-items:center}
  .legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#5c5f73}
  .legend-dot{width:11px;height:11px;border-radius:2px;flex-shrink:0}
  .legend-sep{color:#bcc0cc;font-size:14px}
  .legend-line{display:flex;align-items:center;gap:4px;font-size:11px;color:#5c5f73}
  #network{flex:1;min-height:0;overflow:hidden;background:#eff1f5}
</style>
</head>
<body>
<header>
  <h1>病院建設&#x30FB;開業 &#x2014; 病院設立プロジェクト全体フロー</h1>
  <span class="hint">ドラッグ:パン / ノード:ドラッグ可 / ホイール:ズーム / 全298ノード</span>
  <div class="controls">
    <button onclick="network.fit({animation:false})">Fit</button>
    <button onclick="network.moveTo({scale:network.getScale()*1.3})">+</button>
    <button onclick="network.moveTo({scale:network.getScale()*0.75})">&minus;</button>
    <button onclick="network.setOptions({physics:{enabled:false}});network.setOptions({physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-35,centralGravity:0.003,springLength:200,springConstant:0.018,damping:0.5},stabilization:{enabled:true,iterations:1000,updateInterval:50},maxVelocity:4,minVelocity:0.5}})">Re-layout</button>

</header>
