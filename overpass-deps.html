<!doctype html>
<html><head><meta charset="utf-8"><title>TryHackMe Overpass 攻撃チェーン — ANDゲート版</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eff1f5;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden}
#mynetwork{width:100vw;height:100vh}
#controls{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;gap:8px}
#controls button{padding:8px 16px;background:#ffffff;border:2px solid #9ca0b0;border-radius:8px;cursor:pointer;font-size:20px;color:#4c4f69;transition:all .2s}
#controls button:hover{background:#1e66f5;color:#fff;border-color:#1e66f5}
#info{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.92);padding:6px 18px;border-radius:20px;font-size:18px;color:#4c4f69;border:1px solid #ccd0da;pointer-events:none;white-space:nowrap}
#stats{position:fixed;bottom:20px;left:20px;z-index:10;background:rgba(255,255,255,.92);padding:6px 14px;border-radius:20px;font-size:16px;color:#6c6f85;border:1px solid #ccd0da}
#mynetwork canvas{background:transparent!important}
</style></head><body>
<div id="mynetwork"></div>
<div id="info">TryHackMe Overpass WriteUp</div>
<div id="stats">ドラッグ=パン / ホイール=ズーム / ノードドラッグ可</div>
<div id="controls">
<button onclick="network.fit()">Fit</button>
<button onclick="network.setOptions({physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2}}});network.stabilize(2000)">Re-layout</button>
<button onclick="network.setOptions({physics:{enabled:false}})">Freeze</button>
</div>
<script>
var nodes=new vis.DataSet([{id:'start',label:'START',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'goal',label:'GOAL',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'nmap',label:'nmap\n(22,80)',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'feroxbuster',label:'feroxbuster',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'admin-path',label:'/admin\n発見',shape:'round-octagon',size:45,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'downloads',label:'/downloads',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'aboutus',label:'/aboutus',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'login-js',label:'login.js\n解析',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'cookie-bypass',label:'SessionToken\nバイパス',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'admin-panel',label:'管理パネル',shape:'round-octagon',size:45,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'james-key',label:'james\n暗号化SSH鍵',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'ssh2john',label:'ssh2john',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'john-crack',label:'john\nrockyou',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'james13',label:'james13\n取得',shape:'round-octagon',size:45,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'ssh-ready',label:'SSHログインOK！\n▸ james SSH鍵\n▸ james13',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'ssh-james',label:'SSH\njames',shape:'round-octagon',size:45,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'user-flag',label:'user.txt',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'cron-find',label:'cron解析\n(buildscript)',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'hosts-writable',label:'/etc/hosts\n666',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'fake-script',label:'偽\nbuildscript.sh',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'nc-listener',label:'nc\n待受',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'hosts-hijack',label:'hosts\n偽装',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'root-ready',label:'rootシェルOK！\n▸ jamesシェル\n▸ 攻撃者インフラ\n▸ hosts偽装',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'root-shell',label:'root\nシェル',shape:'round-octagon',size:45,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'root-flag',label:'root.txt',shape:'round-octagon',size:45,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'sudo-dead',label:'sudo -l\n行き止まり',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'suid-dead',label:'SUID\n無用',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}}]);
var edges=new vis.DataSet([{from:'start',to:'nmap',color:{color:'#6c6f85'},width:4},
  {from:'nmap',to:'feroxbuster',color:{color:'#6c6f85'},width:4},
  {from:'feroxbuster',to:'admin-path',color:{color:'#6c6f85'},width:4},
  {from:'feroxbuster',to:'downloads',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'feroxbuster',to:'aboutus',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'admin-path',to:'login-js',color:{color:'#6c6f85'},width:4},
  {from:'login-js',to:'cookie-bypass',color:{color:'#6c6f85'},width:4},
  {from:'cookie-bypass',to:'admin-panel',color:{color:'#6c6f85'},width:4},
  {from:'admin-panel',to:'james-key',color:{color:'#6c6f85'},width:4},
  {from:'cookie-bypass',to:'login-js',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'失敗→再解析'},
  {from:'james-key',to:'ssh2john',color:{color:'#6c6f85'},width:4},
  {from:'ssh2john',to:'john-crack',color:{color:'#6c6f85'},width:4},
  {from:'john-crack',to:'james13',color:{color:'#6c6f85'},width:4},
  {from:'john-crack',to:'ssh2john',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'失敗→辞書変更'},
  {from:'james-key',to:'ssh-ready',color:{color:'#6c6f85'},width:4},
  {from:'james13',to:'ssh-ready',color:{color:'#6c6f85'},width:4},
  {from:'ssh-ready',to:'ssh-james',color:{color:'#6c6f85'},width:4},
  {from:'ssh-james',to:'user-flag',color:{color:'#6c6f85'},width:4},
  {from:'ssh-james',to:'cron-find',color:{color:'#6c6f85'},width:4},
  {from:'ssh-james',to:'hosts-writable',color:{color:'#6c6f85'},width:4},
  {from:'ssh-james',to:'sudo-dead',color:{color:'#6c6f85'},width:2.5,dashes:[3,3]},
  {from:'ssh-james',to:'suid-dead',color:{color:'#6c6f85'},width:2.5,dashes:[3,3]},
  {from:'cron-find',to:'fake-script',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'cron-find',to:'nc-listener',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'hosts-writable',to:'hosts-hijack',color:{color:'#6c6f85'},width:4},
  {from:'ssh-james',to:'root-ready',color:{color:'#6c6f85'},width:4},
  {from:'fake-script',to:'root-ready',color:{color:'#6c6f85'},width:4},
  {from:'nc-listener',to:'root-ready',color:{color:'#6c6f85'},width:4},
  {from:'hosts-hijack',to:'root-ready',color:{color:'#6c6f85'},width:4},
  {from:'root-ready',to:'root-shell',color:{color:'#6c6f85'},width:4},
  {from:'root-shell',to:'root-flag',color:{color:'#6c6f85'},width:4},
  {from:'root-flag',to:'goal',color:{color:'#6c6f85'},width:4}]);
var container=document.getElementById('mynetwork');
var data={nodes:nodes,edges:edges};
var options={nodes:{borderWidth:2,font:{face:'Helvetica Neue,Arial,sans-serif'}},edges:{smooth:{type:'curvedCW',roundness:0.04}},physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2},maxVelocity:3,stabilization:{iterations:2000,updateInterval:50}},interaction:{dragNodes:true,dragView:true,zoomView:true,hover:true,tooltipDelay:300},layout:{improvedLayout:false}};
var network=new vis.Network(container,data,options);
network.on("stabilizationProgress",function(p){document.getElementById('info').innerHTML='安定化中... '+Math.round(p.iterations/options.physics.stabilization.iterations*100)+'%'});
network.once("stabilizationIterationsDone",function(){document.getElementById('info').innerHTML='TryHackMe Overpass WriteUp'});
</script></body></html>
