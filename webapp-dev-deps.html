<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webサービス開発・ローンチ — vis-network版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #eff1f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header {
    padding: 8px 14px;
    background: #e6e9ef;
    border-bottom: 1px solid #ccd0da;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 { font-size: 13px; color: #1e66f5; }
  .controls { display: flex; gap: 6px; margin-left: auto; }
  .controls button {
    background: #e6e9ef; border: 1px solid #bcc0cc; color: #4c4f69;
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  .controls button:hover { background: #dce0e8; }
  .hint { font-size: 11px; color: #9ca0b0; }
  .legend {
    display: flex;
    gap: 12px;
    padding: 5px 14px;
    background: #e6e9ef;
    border-bottom: 1px solid #ccd0da;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5c5f73; }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .legend-sep { color: #bcc0cc; font-size: 14px; }
  .legend-line { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5c5f73; }
  #network { flex: 1; min-height: 0; overflow: hidden; background: #eff1f5; }
</style>
</head>
<body>
<header>
  <h1>Webサービス開発・ローンチ</h1>
  <span class="hint">ドラッグ: パン / ノードドラッグ可 / ホイール: ズーム</span>
  <div class="controls">
    <button onclick="network.fit({animation:false})">Fit</button>
    <button onclick="network.moveTo({scale:network.getScale()*1.3})">＋</button>
    <button onclick="network.moveTo({scale:network.getScale()*0.75})">−</button>
    <button onclick="network.setOptions({physics:{enabled:false}});network.setOptions({physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-60,centralGravity:0.006,springLength:160,springConstant:0.04,damping:0.5},stabilization:{enabled:true,iterations:400,updateInterval:25},maxVelocity:8,minVelocity:0.5}})">Re-layout</button>
  </div>
</header>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e6e9ef;border:2px solid #1e66f5;border-radius:50%"></div>START / GOAL</div>

  <div class="legend-item"><div class="legend-dot" style="background:#dce0e8"></div>企画</div>

</div>
<div id="network"></div>

  { from: 'p7-release',    to: 'p7-announce',   color: '#6c6f85', width: 2, arrows: 'to', dashes: true },

  { from: 'p7-final',      to: 'p6-bugfix',     color: '#d20f39', width: 2.5, arrows: 'to', dashes: true, title: '問題→修正' },

  // ===== 運用 =====
  { from: 'p7-release',    to: 'p8-ops-start',  color: '#1e66f5', width: 4, arrows: 'to' },
  { from: 'p8-ops-start',  to: 'p8-incident',   color: '#6c6f85', width: 2, arrows: 'to', dashes: true },
  { from: 'p8-ops-start',  to: 'p8-slo',        color: '#1e66f5', width: 4, arrows: 'to' },
  { from: 'p8-slo',        to: 'p8-monitor-op', color: '#1e66f5', width: 4, arrows: 'to' },
  { from: 'p8-monitor-op', to: 'p8-perf',       color: '#6c6f85', width: 2, arrows: 'to', dashes: true },

  { from: 'p8-scale',      to: 'goal',          color: '#6c6f85', width: 2, arrows: 'to', dashes: true, title: '継続的改善' },
  { from: 'p7-announce',   to: 'goal',          color: '#6c6f85', width: 2, arrows: 'to', dashes: true, title: '初回リリース達成' },

  // ===== トラブル (運用中) =====
  { from: 'p8-monitor-op', to: 'tr-downtime',   color: '#d20f39', width: 2.5, arrows: 'to', dashes: true, title: '障害検知' },

  { from: 'tr-downtime',   to: 'tr-report',     color: '#d20f39', width: 2.5, arrows: 'to', dashes: true },

// ===== vis-network 設定 =====
var container = document.getElementById('network');
var data = {
  nodes: new vis.DataSet(nodes),
  edges: new vis.DataSet(edges),
};
var options = {
  autoResize: true,
  edges: {
    smooth: { type: 'curvedCW', roundness: 0.1 },
    font: { size: 10, color: '#5c5f73', background: '#eff1f5', strokeWidth: 0 },
  },
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 170,
      springConstant: 0.035,
      damping: 0.5,
    },
    stabilization: {
      enabled: true,
      iterations: 500,
      updateInterval: 25,
    },
    maxVelocity: 6,
    minVelocity: 0.5,
  },
  interaction: {
    dragNodes: true,
    dragView: true,
    hover: true,
    zoomView: true,
  },
};
var network = new vis.Network(container, data, options);
network.fit({ animation: false });
</script>
