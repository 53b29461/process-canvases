<!doctype html>
<html><head><meta charset="utf-8"><title>引越し タスク依存関係グラフ v2</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eff1f5;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden}
#mynetwork{width:100vw;height:100vh}
#controls{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;gap:8px}
#controls button{padding:8px 16px;background:#ffffff;border:2px solid #9ca0b0;border-radius:8px;cursor:pointer;font-size:20px;color:#4c4f69;transition:all .2s}
#controls button:hover{background:#1e66f5;color:#fff;border-color:#1e66f5}
#info{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.92);padding:6px 18px;border-radius:20px;font-size:18px;color:#4c4f69;border:1px solid #ccd0da;pointer-events:none;white-space:nowrap}
#stats{position:fixed;bottom:20px;left:20px;z-index:10;background:rgba(255,255,255,.92);padding:6px 14px;border-radius:20px;font-size:16px;color:#6c6f85;border:1px solid #ccd0da}
#mynetwork canvas{background:transparent!important}
</style></head><body>
<div id="mynetwork"></div>
<div id="info">引越し作業手順</div>
<div id="stats">ドラッグ=パン / ホイール=ズーム / ノードドラッグ可</div>
<div id="controls">
<button onclick="network.fit()">Fit</button>
<button onclick="network.setOptions({physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2}}});network.stabilize(2000)">Re-layout</button>
<button onclick="network.setOptions({physics:{enabled:false}})">Freeze</button>
</div>
<script>
var nodes=new vis.DataSet([{id:'start',label:'START',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'goal',label:'GOAL',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'decide',label:'引越し\n決意・決断',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'budget',label:'予算・条件整理\n(エリア/広さ/\n家賃上限)',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'hunt',label:'新居探し\n・内見',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'apply',label:'申し込み\n・入居審査',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'rejected',label:'審査落ち\n→再検索',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'contract',label:'賃貸契約\n・入金',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'date-set',label:'引越し日\n確定！',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#1e66f5'},font:{color:'#1a1a2e',size:16}},
  {id:'cancel',label:'現住所\n解約通知\n(1ヶ月前まで)',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'restore',label:'原状回復\n・壁紙補修\n・クリーニング',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'clean-old',label:'旧居清掃\n(搬出後)',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'inspect',label:'旧居立会い\n・鍵返却\n(当日)',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'deposit',label:'敷金精算\n(後日)',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'m-quote',label:'引越し業者\n見積もり比較\n(2〜3社)',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'m-book',label:'業者発注\n・日程確定',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'declutter',label:'不用品処分\n(売る/捨てる/\n譲る/寄付)',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'pack-supply',label:'梱包材調達\n(段ボール/テープ/\n緩衝材/マジック)',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'pack-1',label:'荷造り①\n(非日常品)\n本・服・飾り物',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'pack-2',label:'荷造り②\n(中頻度品)\n調理器具・予備日用品',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'valuables',label:'貴重品・\n重要書類を\nひとまとめに',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'pack-3',label:'荷造り③\n(最終日用品)\n当日使う分だけ残す',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'moveout',label:'転出届\n(旧市区町村)',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'movein',label:'転入届\n(新市区町村)\n14日以内',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'util-stop',label:'旧居\nライフライン\n停止連絡',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'util-order',label:'新居\nライフライン\n開通手配',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'internet',label:'インターネット\n移転手続き',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'address',label:'住所変更一括\n(銀行/クレカ/\n保険/サブスク)',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'mail-fwd',label:'郵便転送\n申請',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'work',label:'職場・学校に\n住所変更届',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'school',label:'転校・転園\n手続き(該当時)',shape:'round-octagon',size:39,color:{background:'#8839ef',border:'#7730d8'},font:{color:'#ffffff',size:16}},
  {id:'load-ready',label:'搬出準備OK！\n▸ 業者発注済み\n▸ 荷造り完了\n▸ 貴重品まとめ完了',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'old-clear',label:'旧居明渡しOK！\n▸ 搬出完了\n▸ 清掃完了',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'life-ready',label:'生活基盤OK！\n▸ 寝床確保\n▸ 転入届\n▸ 買い出し完了',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'load-out',label:'業者到着\n・搬出',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'key-get',label:'新居到着\n・鍵受け取り',shape:'round-octagon',size:45,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'load-in',label:'新居へ\n搬入',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'util-on',label:'ガス立会い\n・水道/電気\n開通確認',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'furniture',label:'家具配置\n・大型家電\n設置',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'bed-prep',label:'寝床確保\n(最優先!)',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'trouble',label:'引越し\nトラブル！\n(雨天/渋滞/破損)',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'unpack',label:'荷解き\n(段ボール片付け)',shape:'round-octagon',size:39,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'shopping',label:'足りないもの\n買い出し',shape:'round-octagon',size:39,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'neighbor',label:'近隣挨拶',shape:'round-octagon',size:39,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'settle',label:'新生活\n定着！',shape:'round-octagon',size:45,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'old-close',label:'旧居関連\n完全クローズ',shape:'round-octagon',size:39,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}}]);
var edges=new vis.DataSet([{from:'start',to:'decide',color:{color:'#6c6f85'},width:4},
  {from:'decide',to:'budget',color:{color:'#6c6f85'},width:4},
  {from:'budget',to:'hunt',color:{color:'#6c6f85'},width:4},
  {from:'hunt',to:'apply',color:{color:'#6c6f85'},width:4},
  {from:'apply',to:'contract',color:{color:'#6c6f85'},width:4},
  {from:'apply',to:'rejected',color:{color:'#6c6f85'},width:2.5,dashes:[3,3]},
  {from:'rejected',to:'hunt',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'別物件'},
  {from:'contract',to:'date-set',color:{color:'#6c6f85'},width:4},
  {from:'date-set',to:'cancel',color:{color:'#6c6f85'},width:4},
  {from:'cancel',to:'restore',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'m-quote',color:{color:'#6c6f85'},width:4},
  {from:'m-quote',to:'m-book',color:{color:'#6c6f85'},width:4},
  {from:'date-set',to:'declutter',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'declutter',to:'pack-supply',color:{color:'#6c6f85'},width:4},
  {from:'declutter',to:'pack-2',color:{color:'#6c6f85'},width:4},
  {from:'declutter',to:'valuables',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'pack-supply',to:'pack-1',color:{color:'#6c6f85'},width:4},
  {from:'pack-1',to:'pack-2',color:{color:'#6c6f85'},width:4},
  {from:'pack-2',to:'pack-3',color:{color:'#6c6f85'},width:4},
  {from:'date-set',to:'moveout',color:{color:'#6c6f85'},width:4},
  {from:'date-set',to:'util-stop',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'util-order',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'internet',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'address',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'mail-fwd',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'work',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'date-set',to:'school',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'moveout',to:'movein',color:{color:'#6c6f85'},width:4},
  {from:'m-book',to:'load-ready',color:{color:'#6c6f85'},width:4},
  {from:'pack-3',to:'load-ready',color:{color:'#6c6f85'},width:4},
  {from:'valuables',to:'load-ready',color:{color:'#6c6f85'},width:4},
  {from:'load-ready',to:'load-out',color:{color:'#6c6f85'},width:4},
  {from:'load-out',to:'clean-old',color:{color:'#6c6f85'},width:4},
  {from:'restore',to:'clean-old',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'load-out',to:'key-get',color:{color:'#6c6f85'},width:4},
  {from:'load-out',to:'old-clear',color:{color:'#6c6f85'},width:4},
  {from:'clean-old',to:'old-clear',color:{color:'#6c6f85'},width:4},
  {from:'old-clear',to:'inspect',color:{color:'#6c6f85'},width:4},
  {from:'inspect',to:'deposit',color:{color:'#6c6f85'},width:4},
  {from:'deposit',to:'old-close',color:{color:'#6c6f85'},width:4},
  {from:'key-get',to:'load-in',color:{color:'#6c6f85'},width:4},
  {from:'load-out',to:'load-in',color:{color:'#6c6f85'},width:4},
  {from:'load-in',to:'bed-prep',color:{color:'#6c6f85'},width:4},
  {from:'load-in',to:'util-on',color:{color:'#6c6f85'},width:4},
  {from:'util-order',to:'util-on',color:{color:'#6c6f85'},width:4},
  {from:'load-in',to:'furniture',color:{color:'#6c6f85'},width:4},
  {from:'util-on',to:'furniture',color:{color:'#6c6f85'},width:4},
  {from:'load-out',to:'trouble',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'雨天/渋滞'},
  {from:'load-in',to:'trouble',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'破損/不足'},
  {from:'trouble',to:'load-in',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'対応後再開'},
  {from:'bed-prep',to:'unpack',color:{color:'#6c6f85'},width:4},
  {from:'unpack',to:'shopping',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'unpack',to:'neighbor',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'bed-prep',to:'life-ready',color:{color:'#6c6f85'},width:4},
  {from:'movein',to:'life-ready',color:{color:'#6c6f85'},width:4},
  {from:'shopping',to:'life-ready',color:{color:'#6c6f85'},width:4},
  {from:'life-ready',to:'settle',color:{color:'#6c6f85'},width:4},
  {from:'neighbor',to:'settle',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'old-close',to:'settle',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'settle',to:'goal',color:{color:'#6c6f85'},width:4}]);
var container=document.getElementById('mynetwork');
var data={nodes:nodes,edges:edges};
var options={nodes:{borderWidth:2,font:{face:'Helvetica Neue,Arial,sans-serif'}},edges:{smooth:{type:'curvedCW',roundness:0.04}},physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2},maxVelocity:3,stabilization:{iterations:2000,updateInterval:50}},interaction:{dragNodes:true,dragView:true,zoomView:true,hover:true,tooltipDelay:300},layout:{improvedLayout:false}};
var network=new vis.Network(container,data,options);
network.on("stabilizationProgress",function(p){document.getElementById('info').innerHTML='安定化中... '+Math.round(p.iterations/options.physics.stabilization.iterations*100)+'%'});
network.once("stabilizationIterationsDone",function(){document.getElementById('info').innerHTML='引越し作業手順'});
</script></body></html>
