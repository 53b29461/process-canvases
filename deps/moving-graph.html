<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #eff1f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 8px 14px; background: #e6e9ef; border-bottom: 1px solid #ccd0da; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    header h1 { font-size: 13px; color: #1e66f5; }
    .controls { display: flex; gap: 6px; margin-left: auto; }
    .controls button { background: #ccd0da; border: 1px solid #bcc0cc; color: #4c4f69; border-radius: 6px; padding: 4px 11px; cursor: pointer; font-size: 12px; }
    .controls button:hover { background: #bcc0cc; }
    .hint { font-size: 11px; color: #9ca0b0; }
    .legend { display: flex; gap: 12px; padding: 5px 14px; background: #e6e9ef; border-bottom: 1px solid #ccd0da; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5c5f73; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
    .legend-sep { color: #bcc0cc; font-size: 14px; }
    .legend-line { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5c5f73; }
    #cy { flex: 1; }
  </style>
</head>
<body>
<header>

  <span class="hint">ドラッグ: パン / ホイール: ズーム</span>
  <div class="controls">
    <button onclick="cy.fit()">Fit</button>
    <button onclick="cy.zoom(cy.zoom()*1.4);cy.center()">＋</button>
    <button onclick="cy.zoom(cy.zoom()*0.7);cy.center()">－</button>
    <button onclick="cy.layout(layout).run()">Re-layout</button>
  </div>
</header>
