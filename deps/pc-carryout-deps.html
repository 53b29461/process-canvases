<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>社内PC持ち出し手続き 依存関係グラフ（ANDゲート版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #eff1f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 8px 14px;
      background: #e6e9ef;
      border-bottom: 1px solid #ccd0da;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 13px; color: #1e66f5; }

    .controls { display: flex; gap: 6px; margin-left: auto; }
    .controls button {
      background: #ccd0da; border: 1px solid #bcc0cc; color: #4c4f69;
      border-radius: 6px; padding: 4px 11px; cursor: pointer; font-size: 12px;
    }
    .controls button:hover { background: #bcc0cc; }
    .hint { font-size: 11px; color: #9ca0b0; }

    .legend {
      display: flex;
      gap: 12px;
      padding: 5px 14px;
      background: #e6e9ef;
      border-bottom: 1px solid #ccd0da;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5c5f73; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
    .legend-sep { color: #bcc0cc; font-size: 14px; }
    .legend-line { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5c5f73; }

    #cy { flex: 1; }
  </style>
</head>
<body>

<header>
  <h1>社内PC持ち出し手続き — ANDゲート版</h1>
  <span class="hint">ドラッグ: パン / ホイール: ズーム / Re-layout で再整列</span>
  <div class="controls">
    <button onclick="cy.fit()">Fit</button>
    <button onclick="cy.zoom(cy.zoom() * 1.3); cy.center()">＋</button>
    <button onclick="cy.zoom(cy.zoom() * 0.75); cy.center()">－</button>
    <button onclick="cy.layout(layout).run()">Re-layout</button>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e6e9ef;border:2px solid:#1e66f5"></div>START / GOAL</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#dce0e8;border:1px solid:#bcc0cc"></div>申請・承認</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8caaee"></div>事前準備</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#74c7ec"></div>持ち出し</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a6e3a1"></div>業務中</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fe640b"></div>返却</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d20f39;color:#fff"></div>トラブル</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#df8e1d"></div>完了</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fff;border:2px dashed #40a02b"></div>ANDゲート</div>
  <div class="legend-sep">|</div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#1e66f5" stroke-width="3"/></svg> メイン
  </div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#6c6f85" stroke-width="2" stroke-dasharray="6,3"/></svg> 並行
  </div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#d20f39" stroke-width="2" stroke-dasharray="3,3"/></svg> フィードバック
  </div>
</div>

<div id="cy"></div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script>
const nodes = [
  // ===== START / GOAL =====
  { data: { id: 'start',        label: 'START' },  classes: 'startgoal' },
  { data: { id: 'goal',         label: 'GOAL' },   classes: 'startgoal' },

  // ===== 申請・承認 (白) =====
  { data: { id: 'app-form',     label: '申請書作成' },               classes: 'round   col-white' },
  { data: { id: 'boss-approve', label: '上司承認' },                 classes: 'diamond col-white' },
  { data: { id: 'mgmt-approve', label: '管理部門\n承認' },           classes: 'diamond col-white' },
  { data: { id: 'permit-issue', label: '許可証発行' },               classes: 'hexagon col-white' },

  // ===== 事前準備 (青) =====
  { data: { id: 'encrypt-check', label: '暗号化確認' },              classes: 'ellipse col-blue' },
  { data: { id: 'av-update',     label: 'ウイルス\n定義更新' },     classes: 'ellipse col-blue' },
  { data: { id: 'lock-check',    label: 'ロック機能\n確認' },       classes: 'ellipse col-blue' },
  { data: { id: 'vpn-test',      label: 'VPN接続\nテスト' },        classes: 'ellipse col-blue' },
  { data: { id: 'data-check',    label: 'データ確認\n(不要ﾃﾞｰﾀ精査)' }, classes: 'diamond col-blue' },
  { data: { id: 'device-select', label: '端末選定' },               classes: 'round   col-blue' },
  { data: { id: 'checkout-log',  label: '貸出簿記入' },              classes: 'barrel  col-blue' },
  { data: { id: 'prep-done',     label: '事前準備\n完了' },          classes: 'hexagon col-blue' },

  // ===== ANDゲート: セキュリティ確認 =====
  { data: { id: 'sec-ready',    label: 'セキュリティ確認OK！\n▸ 暗号化確認\n▸ ウイルス定義更新\n▸ ロック機能確認\n▸ VPN接続テスト' }, classes: 'hexagon andgate' },

  // ===== ANDゲート: 事前準備完了 =====
  { data: { id: 'prep-ready',   label: '事前準備完了OK！\n▸ セキュリティOK\n▸ データ確認\n▸ 貸出簿記入' }, classes: 'hexagon andgate' },

  // ===== 持ち出し (水) =====
  { data: { id: 'inspect-pc',   label: '端末外観\n確認' },          classes: 'ellipse col-sky' },
  { data: { id: 'cables',       label: 'ケーブル類\n確認' },        classes: 'ellipse col-sky' },
  { data: { id: 'bag-prep',     label: 'バッグ準備' },               classes: 'round   col-sky' },
  { data: { id: 'doc-check',    label: '書類携行\n確認' },           classes: 'diamond col-sky' },
  { data: { id: 'carry-out',    label: '持ち出し' },                 classes: 'hexagon col-sky' },

  // ===== ANDゲート: 持ち出し準備 =====
  { data: { id: 'carry-ready',  label: '持ち出し準備OK！\n▸ 端末外観確認\n▸ ケーブル類確認\n▸ 書類携行確認' }, classes: 'hexagon andgate' },

  // ===== 業務中 (緑) =====
  { data: { id: 'vpn-connect',  label: 'VPN接続' },                  classes: 'ellipse col-green' },
  { data: { id: 'privacy',      label: 'プライバシー\n対策（画面遮蔽）' }, classes: 'diamond col-green' },
  { data: { id: 'lock-pc',      label: 'PC施錠管理' },               classes: 'ellipse col-green' },
  { data: { id: 'cloud-only',   label: 'クラウド\n限定保存' },       classes: 'diamond col-green' },
  { data: { id: 'checkin',      label: 'チェックイン' },              classes: 'round   col-green' },
  { data: { id: 'end-cleanup',  label: '業務終了\n後清掃' },         classes: 'round   col-green' },
  { data: { id: 'remote-done',  label: '外部作業\n完了' },           classes: 'hexagon col-green' },

  // ===== 返却 (橙) =====
  { data: { id: 'return-notify', label: '返却連絡' },                classes: 'round   col-orange' },
  { data: { id: 'virus-scan',    label: 'ウイルス\nスキャン' },     classes: 'ellipse col-orange' },
  { data: { id: 'data-delete',   label: 'データ削除' },              classes: 'ellipse col-orange' },
  { data: { id: 're-inspect',    label: '再点検' },                   classes: 'diamond col-orange' },
  { data: { id: 'return-log',    label: '返却記帳' },                 classes: 'barrel  col-orange' },
  { data: { id: 'report',        label: '業務報告' },                 classes: 'hexagon col-orange' },

  // ===== ANDゲート: 返却完了 =====
  { data: { id: 'return-ready',  label: '返却完了OK！\n▸ ウイルススキャン\n▸ データ削除\n▸ 再点検' }, classes: 'hexagon andgate' },

  // ===== 完了 (黄) =====
  { data: { id: 'process-end',   label: 'プロセス\n終了' },          classes: 'hexagon col-yellow' },

  // ===== トラブル (赤) =====
  { data: { id: 'lost-theft',    label: '紛失・盗難' },               classes: 'diamond col-red' },
  { data: { id: 'leak',          label: '情報漏洩' },                 classes: 'diamond col-red' },
  { data: { id: 'breakage',      label: '破損' },                     classes: 'diamond col-red' },
  { data: { id: 'virus-detect',  label: 'ウイルス\n検出' },          classes: 'diamond col-red' },
  { data: { id: 'trouble-report', label: 'トラブル\n報告' },         classes: 'round   col-red' },
];

const edges = [
  // ===== START → 申請・承認 =====
  { data: { source: 'start', target: 'app-form' }, classes: 'main' },

  // --- 申請・承認 ---
  { data: { source: 'app-form',     target: 'boss-approve' }, classes: 'main' },
  { data: { source: 'boss-approve', target: 'mgmt-approve' }, classes: 'main' },
  { data: { source: 'mgmt-approve', target: 'permit-issue' }, classes: 'main' },
  // フィードバック
  { data: { source: 'boss-approve', target: 'app-form', label: 'NG→申請書修正' }, classes: 'fb' },
  { data: { source: 'mgmt-approve', target: 'app-form', label: 'NG→再提出' },     classes: 'fb' },

  // --- 許可証→事前準備 ---
  { data: { source: 'permit-issue', target: 'encrypt-check' }, classes: 'main' },
  { data: { source: 'permit-issue', target: 'device-select' }, classes: 'main' },
  { data: { source: 'permit-issue', target: 'data-check' },    classes: 'dashed' },

  // --- 事前準備（AND: sec-ready） ---
  { data: { source: 'encrypt-check', target: 'sec-ready' }, classes: 'main' },
  { data: { source: 'av-update',     target: 'sec-ready' }, classes: 'main' },
  { data: { source: 'lock-check',    target: 'sec-ready' }, classes: 'main' },
  { data: { source: 'vpn-test',      target: 'sec-ready' }, classes: 'main' },
  // セルフループ
  { data: { source: 'encrypt-check', target: 'encrypt-check', label: '未設定→IT相談' }, classes: 'fb' },
  { data: { source: 'data-check',    target: 'data-check',    label: '過剰→精査' },     classes: 'fb' },
  // VPN繋がらず→機種変更
  { data: { source: 'vpn-test',      target: 'device-select', label: '繋がらず→機種変更' }, classes: 'fb' },

  // --- 事前準備（AND: prep-ready） ---
  { data: { source: 'device-select', target: 'checkout-log' }, classes: 'main' },
  { data: { source: 'data-check',    target: 'prep-ready' },   classes: 'main' },
  { data: { source: 'checkout-log',  target: 'prep-ready' },   classes: 'dashed' },
  { data: { source: 'sec-ready',     target: 'prep-ready' },   classes: 'main' },
  { data: { source: 'prep-ready',    target: 'prep-done' },    classes: 'main' },

  // --- 事前準備→持ち出し ---
  { data: { source: 'prep-done', target: 'inspect-pc' }, classes: 'main' },
  { data: { source: 'prep-done', target: 'bag-prep' },   classes: 'dashed' },

  // --- 持ち出し（AND: carry-ready） ---
  { data: { source: 'inspect-pc',  target: 'carry-ready' }, classes: 'main' },
  { data: { source: 'cables',      target: 'carry-ready' }, classes: 'main' },
  { data: { source: 'bag-prep',    target: 'doc-check' },   classes: 'main' },
  { data: { source: 'doc-check',   target: 'carry-ready' }, classes: 'main' },
  { data: { source: 'carry-ready', target: 'carry-out' },   classes: 'main' },
  // フィードバック
  { data: { source: 'doc-check', target: 'permit-issue', label: '許可証不携帯→再発行' }, classes: 'fb' },

  // --- 持ち出し→業務中 ---
  { data: { source: 'carry-out', target: 'vpn-connect' }, classes: 'main' },
  // トラブル分岐
  { data: { source: 'carry-out', target: 'lost-theft', label: '紛失・盗難' }, classes: 'fb' },
  { data: { source: 'carry-out', target: 'breakage',   label: '落下・破損' }, classes: 'fb' },

  // --- 業務中 ---
  { data: { source: 'vpn-connect',  target: 'privacy' },     classes: 'main' },
  { data: { source: 'privacy',      target: 'lock-pc' },     classes: 'main' },
  { data: { source: 'lock-pc',      target: 'cloud-only' },  classes: 'main' },
  { data: { source: 'cloud-only',   target: 'checkin' },     classes: 'main' },
  { data: { source: 'checkin',      target: 'end-cleanup' }, classes: 'main' },
  { data: { source: 'end-cleanup',  target: 'remote-done' }, classes: 'main' },
  // フィードバック
  { data: { source: 'privacy',    target: 'leak', label: 'のぞき見' },     classes: 'fb' },
  { data: { source: 'cloud-only', target: 'leak', label: '誤ローカル保存' }, classes: 'fb' },

  // --- 業務中→返却 ---
  { data: { source: 'remote-done', target: 'return-notify' }, classes: 'main' },

  // --- 返却（AND: return-ready） ---
  { data: { source: 'return-notify', target: 'virus-scan' },  classes: 'main' },
  { data: { source: 'virus-scan',    target: 'return-ready' }, classes: 'main' },
  { data: { source: 'data-delete',   target: 'return-ready' }, classes: 'main' },
  { data: { source: 're-inspect',    target: 'return-ready' }, classes: 'main' },
  { data: { source: 'return-ready',  target: 'return-log' },   classes: 'main' },
  { data: { source: 'return-log',    target: 'report' },       classes: 'main' },
  // フィードバック
  { data: { source: 'virus-scan',  target: 'virus-detect', label: 'ウイルス検出' }, classes: 'fb' },
  { data: { source: 're-inspect',  target: 'breakage',     label: '破損発見' },     classes: 'fb' },

  // --- トラブル ---
  { data: { source: 'lost-theft',   target: 'trouble-report', label: '紛失・盗難報告' }, classes: 'fb' },
  { data: { source: 'leak',         target: 'trouble-report', label: '漏洩報告' },       classes: 'fb' },
  { data: { source: 'breakage',     target: 'trouble-report', label: '破損報告' },       classes: 'fb' },
  { data: { source: 'virus-detect', target: 'trouble-report', label: '検出報告' },       classes: 'fb' },

  // --- 返却→完了 ---
  { data: { source: 'report',       target: 'process-end' }, classes: 'main' },
  { data: { source: 'trouble-report', target: 'process-end', label: '報告後終了' }, classes: 'dashed' },

  // ===== GOAL =====
  { data: { source: 'process-end', target: 'goal' }, classes: 'main' },
];

const elements = { nodes, edges };
const layout = {
  name: 'cose',
  nodeRepulsion: 20000,
  idealEdgeLength: 190,
  gravity: 0.7,
  numIter: 1200,
  animate: true,
  animationDuration: 500
};

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    {
      selector: 'node',
      style: {
        label: 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': 110,
        'font-size': 12,
        'font-family': '"Noto Sans JP", "Segoe UI", sans-serif',
        color: '#4c4f69',
        'text-halign': 'center',
        'text-valign': 'center',
        'font-weight': 'bold',
        'border-width': 2,
        'border-color': '#9ca0b0',
        width: 120,
        height: 72,
      }
    },
    // START / GOAL
    {
      selector: '.startgoal',
      style: {
        'background-color': '#e6e9ef',
        'border-color': '#1e66f5',
        'border-width': 4,
        color: '#1e66f5',
        'font-size': 16,
        shape: 'round-octagon',
        width: 100,
        height: 70,
      }
    },
    // Phase colors (Catppuccin Latte light mode)
    { selector: '.col-white',  style: { 'background-color': '#dce0e8', 'border-color': '#bcc0cc' } },
    { selector: '.col-blue',   style: { 'background-color': '#8caaee', 'border-color': '#7c9ae6', color: '#222' } },
    { selector: '.col-sky',    style: { 'background-color': '#74c7ec', 'border-color': '#5bb9e3', color: '#222' } },
    { selector: '.col-green',  style: { 'background-color': '#a6e3a1', 'border-color': '#85d687', color: '#333' } },
    { selector: '.col-orange', style: { 'background-color': '#fe640b', 'border-color': '#e65a0a', color: '#fff' } },
    { selector: '.col-red',    style: { 'background-color': '#d20f39', 'border-color': '#bb0d33', color: '#fff' } },
    { selector: '.col-yellow', style: { 'background-color': '#df8e1d', 'border-color': '#c8801a', 'border-width': 3, color: '#222' } },
    // Shapes
    { selector: '.ellipse', style: { shape: 'ellipse' } },
    { selector: '.hexagon', style: { shape: 'hexagon', width: 130, height: 80 } },
    { selector: '.diamond', style: { shape: 'diamond', width: 100, height: 90 } },
    { selector: '.round',   style: { shape: 'roundrectangle' } },
    { selector: '.barrel',  style: { shape: 'round-rectangle', width: 140, height: 80 } },
    // ANDゲート（白背景、緑破線枠、チェックリスト表示）
    {
      selector: '.andgate',
      style: {
        'background-color': '#fff',
        'border-color': '#40a02b',
        'border-width': 4,
        'border-style': 'dashed',
        color: '#196c21',
        shape: 'hexagon',
        width: 140,
        height: 90,
        'font-size': 11,
      }
    },
    // Edges
    {
      selector: 'edge',
      style: {
        width: 2,
        'line-color': '#6c6f85',
        'target-arrow-color': '#6c6f85',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 1,
        'curve-style': 'bezier',
        label: 'data(label)',
        'font-size': 10,
        color: '#5c5f73',
        'text-background-color': '#eff1f5',
        'text-background-opacity': 0.85,
        'text-background-padding': 2,
      }
    },
    // メイン依存（青実線）
    { selector: '.main', style: { width: 4, 'line-color': '#1e66f5', 'target-arrow-color': '#1e66f5', 'z-index': 10 } },
    // 並行可能（灰点線）
    { selector: '.dashed', style: { 'line-style': 'dashed', 'line-dash-pattern': [6, 4], 'z-index': 5 } },
    // フィードバック（赤破線）
    {
      selector: '.fb',
      style: {
        'line-style': 'dashed',
        'line-dash-pattern': [3, 3],
        width: 2.5,
        'line-color': '#d20f39',
        'target-arrow-color': '#d20f39',
        'z-index': 15,
        'target-arrow-shape': 'triangle-backcurve',
        color: '#d20f39',
      }
    },
    { selector: 'node:selected', style: { 'border-color': '#df8e1d', 'border-width': 3 } },
  ],
  layout,
  wheelSensitivity: 0.3,
  minZoom: 0.2,
  maxZoom: 4,
});
</script>
</body>
</html>
