var container=document.getElementById('mynetwork');
var data={nodes:nodes,edges:edges};
var GR=480; // glow radius (half edge) — 4x v7
// Build node color map (cache to avoid per-frame lookup)
var ncm={};var nds=nodes.get();
for(var i=0;i<nds.length;i++){var c=nds[i].color&&nds[i].color.background?nds[i].color.background:'#1e66f5';ncm[nds[i].id]=c;}
var options={nodes:{borderWidth:2,opacity:0.7,font:{face:'Helvetica Neue,Arial,sans-serif'}},edges:{smooth:{type:'curvedCW',roundness:0.04}},physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2},maxVelocity:3,stabilization:{iterations:2000,updateInterval:50}},interaction:{dragNodes:true,dragView:true,zoomView:true,hover:true,tooltipDelay:300},layout:{improvedLayout:false}};
var network=new vis.Network(container,data,options);
// Per-node glow aura via canvas beforeDrawing
network.on("beforeDrawing",function(ctx){
  var pos=network.getPositions();if(!pos)return;
  for(var id in pos){
    var p=pos[id];var c=ncm[id]||'#1e66f5';
    var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    var grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,GR);
    grad.addColorStop(0,'rgba('+r+','+g+','+b+',0.3)');
    grad.addColorStop(0.3,'rgba('+r+','+g+','+b+',0.12)');
    grad.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
    ctx.fillStyle=grad;ctx.fillRect(p.x-GR,p.y-GR,GR*2,GR*2);
  }
});
container.querySelector('canvas').style.background='transparent';
network.on("stabilizationProgress",function(p){document.getElementById('info').innerHTML='安定化中... '+Math.round(p.iterations/options.physics.stabilization.iterations*100)+'%'});
network.once("stabilizationIterationsDone",function(){document.getElementById('info').innerHTML='航空機開発プログラム（民間旅客機）'});
