<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>引越し 時系列タイムライン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #eff1f5; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 8px 14px;
      background: #e6e9ef;
      border-bottom: 1px solid #ccd0da;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 13px; color: #1e66f5; }

    .controls { display: flex; gap: 6px; margin-left: auto; }
    .controls button {
      background: #ccd0da; border: 1px solid #bcc0cc; color: #4c4f69;
      border-radius: 6px; padding: 4px 11px; cursor: pointer; font-size: 12px;
    }
    .controls button:hover { background: #bcc0cc; }
    .hint { font-size: 11px; color: #9ca0b0; }

    .legend {
      display: flex;
      gap: 12px;
      padding: 5px 14px;
      background: #e6e9ef;
      border-bottom: 1px solid #ccd0da;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5c5f73; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
    .legend-sep { color: #bcc0cc; font-size: 14px; }
    .legend-line { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #5c5f73; }
    .legend-ph { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #9ca0b0; }

    #cy { flex: 1; }
  </style>
</head>
<body>

<header>
  <h1>引越し 時系列タイムライン</h1>
  <span class="hint">ドラッグ: パン / ホイール: ズーム / Re-layout で再整列</span>
  <div class="controls">
    <button onclick="cy.fit()">Fit</button>
    <button onclick="cy.zoom(cy.zoom() * 1.3); cy.center()">＋</button>
    <button onclick="cy.zoom(cy.zoom() * 0.75); cy.center()">－</button>
    <button onclick="cy.layout(layout).run()">Re-layout</button>
  </div>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#e6e9ef;border:2px solid:#1e66f5"></div>START / GOAL</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fff;border:2px solid:#1e66f5"></div>フェーズ区切り</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#dce0e8"></div>家探し</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#8caaee"></div>1ヶ月前</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#74c7ec"></div>1週間前</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#a6e3a1"></div>数日前</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#fe640b"></div>前日</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#d20f39"></div>当日</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#8839ef"></div>翌日</div>
  <div class="legend-sep">|</div>
  <div class="legend-item"><div class="legend-ph" style="background:#df8e1d"></div>数日後</div>
  <div class="legend-sep">|</div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#1e66f5" stroke-width="3"/></svg> 時系列メイン
  </div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#6c6f85" stroke-width="2" stroke-dasharray="6,3"/></svg> 並行タスク
  </div>
  <div class="legend-line">
    <svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#d20f39" stroke-width="2" stroke-dasharray="3,3"/></svg> フィードバック
  </div>
</div>

<div id="cy"></div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script>
const nodes = [
  // ===== START / GOAL =====
  { data: { id: 'start', label: 'START' }, classes: 'startgoal' },
  { data: { id: 'goal',  label: 'GOAL'  }, classes: 'startgoal' },

  // ===== [0] 家探し〜契約 / 時期未定 (col-white) =====
  { data: { id: 'ph1-head',  label: '家探し\n〜契約' },       classes: 'phase-head col-white' },
  { data: { id: 'hunting',   label: '引越し決意\n・条件整理\n(予算/エリア/広さ)' }, classes: 'ellipse col-white' },
  { data: { id: 'search',    label: '新居情報収集\n・内見' },  classes: 'ellipse col-white' },
  { data: { id: 'apply',     label: '申し込み\n・入居審査' },  classes: 'diamond col-white' },
  { data: { id: 'rejected',  label: '審査落ち\n→再検索' },     classes: 'diamond col-red' },
  { data: { id: 'contract',  label: '賃貸契約\n・入金' },       classes: 'round   col-white' },

  // ===== [1] 1ヶ月前 (col-blue) =====
  { data: { id: 'ph2-head',  label: '▶︎ 1ヶ月前\n引越し日確定' }, classes: 'phase-head col-blue' },
  { data: { id: 'cancel',    label: '現住所\n解約通知' },        classes: 'ellipse col-blue' },
  { data: { id: 'mover-1m',  label: '引越し業者\n見積もり比較' }, classes: 'diamond col-blue' },
  { data: { id: 'declutter', label: '不用品処分\n(売る/捨てる/\n譲る/寄付)' }, classes: 'ellipse col-blue' },
  { data: { id: 'moveout',   label: '転出届\n(旧市区町村)' },    classes: 'round   col-blue' },
  { data: { id: 'mail-fwd',  label: '郵便転送\n申請', },        classes: 'round   col-blue' },

  // ===== [2] 1週間前 (col-sky) =====
  { data: { id: 'ph3-head',  label: '▶︎ 1週間前\n本格始動' },   classes: 'phase-head col-sky' },
  { data: { id: 'mover-book',label: '引越し業者\n発注・確定' },   classes: 'round   col-sky' },
  { data: { id: 'pack-supp', label: '梱包資材調達\n(段ボール/\nガムテープ)' }, classes: 'round   col-sky' },
  { data: { id: 'pack-1',    label: '荷造り①\n(非日常品:\n本/服飾雑貨)' }, classes: 'ellipse col-sky' },
  { data: { id: 'util-stop', label: '旧居ライフライン\n停止連絡', }, classes: 'round   col-sky' },
  { data: { id: 'util-on',   label: '新居ライフライン\n開通手配', }, classes: 'round   col-sky' },

  // ===== [3] 数日前 (col-green) =====
  { data: { id: 'ph4-head',  label: '▶︎ 数日前\n大詰め' },     classes: 'phase-head col-green' },
  { data: { id: 'pack-2',    label: '荷造り②\n(中頻度品:\n調理器具/日用品)' }, classes: 'ellipse col-green' },
  { data: { id: 'restore',   label: '原状回復\n・壁紙補修\n・クリーニング' }, classes: 'ellipse col-green' },
  { data: { id: 'addr-chg',  label: '住所変更一括\n(銀行/クレカ/\n保険/サブスク)' }, classes: 'barrel col-green' },
  { data: { id: 'internet',  label: 'インターネット\n移転手続き' }, classes: 'round   col-green' },
  { data: { id: 'work',      label: '職場・学校に\n住所変更届' },  classes: 'round   col-green' },
  { data: { id: 'school',    label: '転校・転園\n手続き(該当時)' }, classes: 'round   col-green' },
  { data: { id: 'valuables', label: '貴重品・重要\n書類をまとめる' }, classes: 'diamond col-green' },

  // ===== [4] 前日 (col-orange) =====
  { data: { id: 'ph5-head',  label: '▶︎ 前日\n準備完了' },     classes: 'phase-head col-orange' },
  { data: { id: 'pack-3',    label: '荷造り完了\n(最終日用品\nのみ残す)' }, classes: 'ellipse col-orange' },
  { data: { id: 'clean',     label: '旧居清掃\n(大まかに)', },   classes: 'ellipse col-orange' },
  { data: { id: 'final-chk', label: '最終確認\n(書類/貴重品/\n道順/集合時間)' }, classes: 'diamond col-orange' },

  // ===== [5] 当日 (col-red) =====
  { data: { id: 'ph6-head',  label: '≡ 当日\n引越し実行！' },  classes: 'phase-head col-red' },
  { data: { id: 'load-out',  label: '業者到着\n・搬出' },        classes: 'ellipse col-red' },
  { data: { id: 'inspect',   label: '旧居立会い\n・鍵返却' },    classes: 'diamond col-red' },
  { data: { id: 'key-get',   label: '新居到着\n・鍵受け取り' },  classes: 'hexagon col-red' },
  { data: { id: 'load-in',   label: '搬入', },                  classes: 'ellipse col-red' },
  { data: { id: 'util-confirm', label: 'ガス立会い\n・水道/電気\n開通確認' }, classes: 'round   col-red' },
  { data: { id: 'furniture', label: '家具配置\n・大型家電\n設置' }, classes: 'ellipse col-red' },
  { data: { id: 'trouble',   label: '引越し\nトラブル！\n(雨天/渋滞/破損)' }, classes: 'diamond col-red' },

  // ===== [6] 翌日 (col-mauve) =====
  { data: { id: 'ph7-head',  label: '▶︎ 翌日\nひと段落' },    classes: 'phase-head col-mauve' },
  { data: { id: 'unpack',    label: '荷解き\n(段ボール撤去)' },  classes: 'ellipse col-mauve' },
  { data: { id: 'neighbor',  label: '近隣挨拶', },              classes: 'round   col-mauve' },
  { data: { id: 'shopping',  label: '足りないもの\n買い出し' },   classes: 'round   col-mauve' },
  { data: { id: 'pack-daily-final', label: '最終日用品\n荷解き', }, classes: 'ellipse col-mauve' },

  // ===== [7] 数日後〜1週間以内 (col-yellow) =====
  { data: { id: 'ph8-head',  label: '▶︎ 数日後\n〜1週間以内' }, classes: 'phase-head col-yellow' },
  { data: { id: 'movein',    label: '転入届\n(新市区町村)\n14日以内' }, classes: 'round   col-yellow' },
  { data: { id: 'deposit',   label: '旧居敷金\n精算', },         classes: 'round   col-yellow' },
  { data: { id: 'old-close', label: '旧居関連\n完全クローズ', },   classes: 'diamond col-yellow' },
  { data: { id: 'settle',    label: '新生活\n定着！', },          classes: 'hexagon col-yellow' },
];

const edges = [
  // ===== START =====
  { data: { source: 'start',   target: 'ph1-head' }, classes: 'main' },

  // --- 家探し〜契約（時系列メイン） ---
  { data: { source: 'ph1-head',target: 'hunting' },  classes: 'main' },
  { data: { source: 'hunting', target: 'search' },   classes: 'main' },
  { data: { source: 'search',  target: 'apply' },    classes: 'main' },
  { data: { source: 'apply',   target: 'contract' }, classes: 'main' },
  // 審査フィードバック
  { data: { source: 'apply',   target: 'rejected' }, classes: 'fb' },
  { data: { source: 'rejected',target: 'search', label: '別物件' }, classes: 'fb' },

  // 契約 → 1ヶ月前
  { data: { source: 'contract', target: 'ph2-head' }, classes: 'main' },

  // --- 1ヶ月前 ---
  { data: { source: 'ph2-head', target: 'cancel' },    classes: 'main' },
  { data: { source: 'ph2-head', target: 'mover-1m' },  classes: 'dashed' },
  { data: { source: 'ph2-head', target: 'declutter' }, classes: 'dashed' },
  { data: { source: 'ph2-head', target: 'moveout' },   classes: 'dashed' },
  { data: { source: 'ph2-head', target: 'mail-fwd' },  classes: 'dashed' },
  // 不用品処分は継続的
  { data: { source: 'declutter', target: 'pack-supp' }, classes: 'dashed' },

  // 1ヶ月前 → 1週間前
  { data: { source: 'cancel',   target: 'ph3-head' }, classes: 'main' },

  // --- 1週間前 ---
  { data: { source: 'ph3-head',  target: 'mover-book' }, classes: 'main' },
  { data: { source: 'ph3-head',  target: 'pack-supp' },  classes: 'dashed' },
  { data: { source: 'ph3-head',  target: 'util-stop' },  classes: 'dashed' },
  { data: { source: 'ph3-head',  target: 'util-on' },    classes: 'dashed' },
  { data: { source: 'pack-supp', target: 'pack-1' },     classes: 'main' },
  // 見積もりFB
  { data: { source: 'mover-1m',  target: 'mover-book', label: '比較して決定' }, classes: 'main' },
  { data: { source: 'mover-1m',  target: 'mover-1m',   label: '高い→再見積' }, classes: 'fb' },

  // 1週間前 → 数日前
  { data: { source: 'pack-1',   target: 'ph4-head' }, classes: 'main' },

  // --- 数日前 ---
  { data: { source: 'ph4-head', target: 'pack-2' },     classes: 'main' },
  { data: { source: 'ph4-head', target: 'restore' },    classes: 'dashed' },
  { data: { source: 'ph4-head', target: 'addr-chg' },   classes: 'dashed' },
  { data: { source: 'ph4-head', target: 'internet' },   classes: 'dashed' },
  { data: { source: 'ph4-head', target: 'work' },       classes: 'dashed' },
  { data: { source: 'ph4-head', target: 'school' },     classes: 'dashed' },
  { data: { source: 'ph4-head', target: 'valuables' },  classes: 'dashed' },
  // 荷造り連続
  { data: { source: 'pack-2',   target: 'ph5-head' }, classes: 'main' },

  // --- 前日 ---
  { data: { source: 'ph5-head',  target: 'pack-3' },    classes: 'main' },
  { data: { source: 'ph5-head',  target: 'clean' },     classes: 'dashed' },
  { data: { source: 'ph5-head',  target: 'final-chk' }, classes: 'dashed' },
  { data: { source: 'pack-3',    target: 'ph6-head' },  classes: 'main' },
  { data: { source: 'final-chk', target: 'ph6-head' },  classes: 'dashed' },

  // --- 当日（時系列順） ---
  { data: { source: 'ph6-head',   target: 'load-out' },     classes: 'main' },
  { data: { source: 'load-out',   target: 'key-get' },      classes: 'main' },
  { data: { source: 'key-get',    target: 'load-in' },      classes: 'main' },
  { data: { source: 'load-in',    target: 'util-confirm' }, classes: 'main' },
  { data: { source: 'util-confirm', target: 'furniture' },  classes: 'main' },
  // 旧居立会い・鍵返却は並行（旧居→新居の移動中に立ち会い）
  { data: { source: 'load-out',   target: 'inspect' },      classes: 'dashed' },
  { data: { source: 'inspect',    target: 'key-get' },      classes: 'dashed' },
  // トラブル
  { data: { source: 'load-out',   target: 'trouble', label: '雨天/渋滞' }, classes: 'fb' },
  { data: { source: 'load-in',    target: 'trouble', label: '破損/不足' }, classes: 'fb' },
  { data: { source: 'trouble',    target: 'load-in', label: '対応後再開' }, classes: 'fb' },

  // 当日 → 翌日
  { data: { source: 'furniture', target: 'ph7-head' }, classes: 'main' },

  // --- 翌日 ---
  { data: { source: 'ph7-head', target: 'unpack' },         classes: 'main' },
  { data: { source: 'ph7-head', target: 'neighbor' },       classes: 'dashed' },
  { data: { source: 'unpack',   target: 'pack-daily-final' }, classes: 'main' },
  { data: { source: 'unpack',   target: 'shopping' },       classes: 'dashed' },

  // 翌日 → 数日後
  { data: { source: 'pack-daily-final', target: 'ph8-head' }, classes: 'main' },

  // --- 数日後〜1週間以内 ---
  { data: { source: 'ph8-head', target: 'movein' },   classes: 'main' },
  { data: { source: 'ph8-head', target: 'deposit' },  classes: 'dashed' },
  { data: { source: 'movein',   target: 'settle' },   classes: 'main' },
  { data: { source: 'deposit',  target: 'old-close' }, classes: 'main' },
  { data: { source: 'old-close',target: 'settle' },    classes: 'dashed' },

  // ===== GOAL =====
  { data: { source: 'settle', target: 'goal' }, classes: 'main' },
];

const elements = { nodes, edges };
const layout = {
  name: 'cose',
  nodeRepulsion: 15000,
  idealEdgeLength: 170,
  gravity: 0.8,
  numIter: 1000,
  animate: true,
  animationDuration: 500
};

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements,
  style: [
    {
      selector: 'node',
      style: {
        label: 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': '100px',
        'font-size': '13px',
        'font-family': '"Noto Sans JP", "Segoe UI", sans-serif',
        color: '#4c4f69',
        'text-halign': 'center',
        'text-valign': 'center',
        'font-weight': 'bold',
        'border-width': 2,
        'border-color': '#9ca0b0',
        width: 120,
        height: 72,
      }
    },
    // START / GOAL
    {
      selector: '.startgoal',
      style: {
        'background-color': '#e6e9ef',
        'border-color': '#1e66f5',
        'border-width': 4,
        color: '#1e66f5',
        'font-size': '16px',
        shape: 'round-octagon',
        width: 100,
        height: 70,
      }
    },
    // Phase headers
    {
      selector: '.phase-head',
      style: {
        'border-width': 3,
        'border-color': '#1e66f5',
        'font-size': '12px',
        width: 110,
        height: 55,
        shape: 'round-tag',
      }
    },
    // Phase colors (light mode)
    { selector: '.col-white',  style: { 'background-color': '#dce0e8', 'border-color': '#bcc0cc' } },
    { selector: '.col-blue',   style: { 'background-color': '#8caaee', 'border-color': '#7c9ae6', color: '#222' } },
    { selector: '.col-sky',    style: { 'background-color': '#74c7ec', 'border-color': '#5bb9e3', color: '#222' } },
    { selector: '.col-orange', style: { 'background-color': '#fe640b', 'border-color': '#e65a0a', color: '#fff' } },
    { selector: '.col-green',  style: { 'background-color': '#a6e3a1', 'border-color': '#85d687', color: '#333' } },
    { selector: '.col-mauve',  style: { 'background-color': '#8839ef', 'border-color': '#7731d8', color: '#fff' } },
    { selector: '.col-red',    style: { 'background-color': '#d20f39', 'border-color': '#bb0d33', color: '#fff' } },
    { selector: '.col-gray',   style: { 'background-color': '#6c6f85', 'border-color': '#5c5f73', color: '#e6e9ef' } },
    { selector: '.col-yellow', style: { 'background-color': '#df8e1d', 'border-color': '#c8801a', 'border-width': 3, color: '#222' } },
    // Shapes
    { selector: '.ellipse', style: { shape: 'ellipse' } },
    { selector: '.hexagon', style: { shape: 'hexagon', width: 130, height: 80 } },
    { selector: '.diamond', style: { shape: 'diamond', width: 100, height: 90 } },
    { selector: '.round',   style: { shape: 'roundrectangle' } },
    { selector: '.barrel',  style: { shape: 'round-rectangle', width: 140, height: 80 } },
    // Edges
    {
      selector: 'edge',
      style: {
        width: 2,
        'line-color': '#6c6f85',
        'target-arrow-color': '#6c6f85',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 1,
        'curve-style': 'bezier',
        label: 'data(label)',
        'font-size': '10px',
        color: '#5c5f73',
        'text-background-color': '#eff1f5',
        'text-background-opacity': 0.85,
        'text-background-padding': 2,
      }
    },
    { selector: '.main',   style: { width: 4, 'line-color': '#1e66f5', 'target-arrow-color': '#1e66f5', 'z-index': 10 } },
    { selector: '.dashed', style: { 'line-style': 'dashed', 'line-dash-pattern': [6,4], 'z-index': 5 } },
    {
      selector: '.fb',
      style: {
        'line-style': 'dashed',
        'line-dash-pattern': [3, 3],
        width: 2.5,
        'line-color': '#d20f39',
        'target-arrow-color': '#d20f39',
        'z-index': 15,
        'target-arrow-shape': 'triangle-backcurve',
        color: '#d20f39',
      }
    },
    { selector: 'node:selected', style: { 'border-color': '#df8e1d', 'border-width': 3 } },
  ],
  layout,
  wheelSensitivity: 0.3,
  minZoom: 0.2,
  maxZoom: 4,
});
</script>
</body>
</html>
