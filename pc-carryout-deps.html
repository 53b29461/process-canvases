<!doctype html>
<html><head><meta charset="utf-8"><title>社内PC持ち出し手続き 依存関係グラフ（ANDゲート版）</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eff1f5;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden}
#mynetwork{width:100vw;height:100vh}
#controls{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;gap:8px}
#controls button{padding:8px 16px;background:#ffffff;border:2px solid #9ca0b0;border-radius:8px;cursor:pointer;font-size:20px;color:#4c4f69;transition:all .2s}
#controls button:hover{background:#1e66f5;color:#fff;border-color:#1e66f5}
#info{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.92);padding:6px 18px;border-radius:20px;font-size:18px;color:#4c4f69;border:1px solid #ccd0da;pointer-events:none;white-space:nowrap}
#stats{position:fixed;bottom:20px;left:20px;z-index:10;background:rgba(255,255,255,.92);padding:6px 14px;border-radius:20px;font-size:16px;color:#6c6f85;border:1px solid #ccd0da}
#mynetwork canvas{background:transparent!important}
</style></head><body>
<div id="mynetwork"></div>
<div id="info">社内PC持出要領</div>
<div id="stats">ドラッグ=パン / ホイール=ズーム / ノードドラッグ可</div>
<div id="controls">
<button onclick="network.fit()">Fit</button>
<button onclick="network.setOptions({physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2}}});network.stabilize(2000)">Re-layout</button>
<button onclick="network.setOptions({physics:{enabled:false}})">Freeze</button>
</div>
<script>
var nodes=new vis.DataSet([{id:'start',label:'START',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'goal',label:'GOAL',shape:'round-octagon',size:54,color:{background:'#1e66f5',border:'#1e66f5'},font:{color:'#ffffff',size:21,bold:true}},
  {id:'app-form',label:'申請書作成',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'boss-approve',label:'上司承認',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'mgmt-approve',label:'管理部門\n承認',shape:'round-octagon',size:39,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'permit-issue',label:'許可証発行',shape:'round-octagon',size:45,color:{background:'#dce0e8',border:'#9ca0b0'},font:{color:'#1a1a2e',size:16}},
  {id:'encrypt-check',label:'暗号化確認',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'av-update',label:'ウイルス\n定義更新',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'lock-check',label:'ロック機能\n確認',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'vpn-test',label:'VPN接続\nテスト',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'data-check',label:'データ確認\n(不要ﾃﾞｰﾀ精査)',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'device-select',label:'端末選定',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'checkout-log',label:'貸出簿記入',shape:'round-octagon',size:39,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'prep-done',label:'事前準備\n完了',shape:'round-octagon',size:45,color:{background:'#8caaee',border:'#5c7cd8'},font:{color:'#1a1a2e',size:16}},
  {id:'sec-ready',label:'セキュリティ確認OK！\n▸ 暗号化確認\n▸ ウイルス定義更新\n▸ ロック機能確認\n▸ VPN接続テスト',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'prep-ready',label:'事前準備完了OK！\n▸ セキュリティOK\n▸ データ確認\n▸ 貸出簿記入',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'inspect-pc',label:'端末外観\n確認',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'cables',label:'ケーブル類\n確認',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'bag-prep',label:'バッグ準備',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'doc-check',label:'書類携行\n確認',shape:'round-octagon',size:39,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'carry-out',label:'持ち出し',shape:'round-octagon',size:45,color:{background:'#74c7ec',border:'#5bb9e3'},font:{color:'#1a1a2e',size:16}},
  {id:'carry-ready',label:'持ち出し準備OK！\n▸ 端末外観確認\n▸ ケーブル類確認\n▸ 書類携行確認',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'vpn-connect',label:'VPN接続',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'privacy',label:'プライバシー\n対策（画面遮蔽）',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'lock-pc',label:'PC施錠管理',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'cloud-only',label:'クラウド\n限定保存',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'checkin',label:'チェックイン',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'end-cleanup',label:'業務終了\n後清掃',shape:'round-octagon',size:39,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'remote-done',label:'外部作業\n完了',shape:'round-octagon',size:45,color:{background:'#a6e3a1',border:'#85d687'},font:{color:'#1a1a2e',size:16}},
  {id:'return-notify',label:'返却連絡',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'virus-scan',label:'ウイルス\nスキャン',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'data-delete',label:'データ削除',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'re-inspect',label:'再点検',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'return-log',label:'返却記帳',shape:'round-octagon',size:39,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'report',label:'業務報告',shape:'round-octagon',size:45,color:{background:'#fe640b',border:'#e65a0a'},font:{color:'#1a1a2e',size:16}},
  {id:'return-ready',label:'返却完了OK！\n▸ ウイルススキャン\n▸ データ削除\n▸ 再点検',shape:'round-octagon',size:48,color:{background:'#ffffff',border:'#40a02b'},font:{color:'#1a1a2e',size:16}},
  {id:'process-end',label:'プロセス\n終了',shape:'round-octagon',size:45,color:{background:'#df8e1d',border:'#c8801a'},font:{color:'#1a1a2e',size:16}},
  {id:'lost-theft',label:'紛失・盗難',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'leak',label:'情報漏洩',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'breakage',label:'破損',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'virus-detect',label:'ウイルス\n検出',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}},
  {id:'trouble-report',label:'トラブル\n報告',shape:'round-octagon',size:39,color:{background:'#d20f39',border:'#bb0d33'},font:{color:'#ffffff',size:16}}]);
var edges=new vis.DataSet([{from:'start',to:'app-form',color:{color:'#6c6f85'},width:4},
  {from:'app-form',to:'boss-approve',color:{color:'#6c6f85'},width:4},
  {from:'boss-approve',to:'mgmt-approve',color:{color:'#6c6f85'},width:4},
  {from:'mgmt-approve',to:'permit-issue',color:{color:'#6c6f85'},width:4},
  {from:'boss-approve',to:'app-form',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'NG→申請書修正'},
  {from:'mgmt-approve',to:'app-form',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'NG→再提出'},
  {from:'permit-issue',to:'encrypt-check',color:{color:'#6c6f85'},width:4},
  {from:'permit-issue',to:'device-select',color:{color:'#6c6f85'},width:4},
  {from:'permit-issue',to:'data-check',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'encrypt-check',to:'sec-ready',color:{color:'#6c6f85'},width:4},
  {from:'av-update',to:'sec-ready',color:{color:'#6c6f85'},width:4},
  {from:'lock-check',to:'sec-ready',color:{color:'#6c6f85'},width:4},
  {from:'vpn-test',to:'sec-ready',color:{color:'#6c6f85'},width:4},
  {from:'encrypt-check',to:'encrypt-check',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'未設定→IT相談'},
  {from:'data-check',to:'data-check',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'過剰→精査'},
  {from:'vpn-test',to:'device-select',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'繋がらず→機種変更'},
  {from:'device-select',to:'checkout-log',color:{color:'#6c6f85'},width:4},
  {from:'data-check',to:'prep-ready',color:{color:'#6c6f85'},width:4},
  {from:'checkout-log',to:'prep-ready',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'sec-ready',to:'prep-ready',color:{color:'#6c6f85'},width:4},
  {from:'prep-ready',to:'prep-done',color:{color:'#6c6f85'},width:4},
  {from:'prep-done',to:'inspect-pc',color:{color:'#6c6f85'},width:4},
  {from:'prep-done',to:'bag-prep',color:{color:'#6c6f85'},width:2,dashes:[6,4]},
  {from:'inspect-pc',to:'carry-ready',color:{color:'#6c6f85'},width:4},
  {from:'cables',to:'carry-ready',color:{color:'#6c6f85'},width:4},
  {from:'bag-prep',to:'doc-check',color:{color:'#6c6f85'},width:4},
  {from:'doc-check',to:'carry-ready',color:{color:'#6c6f85'},width:4},
  {from:'carry-ready',to:'carry-out',color:{color:'#6c6f85'},width:4},
  {from:'doc-check',to:'permit-issue',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'許可証不携帯→再発行'},
  {from:'carry-out',to:'vpn-connect',color:{color:'#6c6f85'},width:4},
  {from:'carry-out',to:'lost-theft',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'紛失・盗難'},
  {from:'carry-out',to:'breakage',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'落下・破損'},
  {from:'vpn-connect',to:'privacy',color:{color:'#6c6f85'},width:4},
  {from:'privacy',to:'lock-pc',color:{color:'#6c6f85'},width:4},
  {from:'lock-pc',to:'cloud-only',color:{color:'#6c6f85'},width:4},
  {from:'cloud-only',to:'checkin',color:{color:'#6c6f85'},width:4},
  {from:'checkin',to:'end-cleanup',color:{color:'#6c6f85'},width:4},
  {from:'end-cleanup',to:'remote-done',color:{color:'#6c6f85'},width:4},
  {from:'privacy',to:'leak',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'のぞき見'},
  {from:'cloud-only',to:'leak',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'誤ローカル保存'},
  {from:'remote-done',to:'return-notify',color:{color:'#6c6f85'},width:4},
  {from:'return-notify',to:'virus-scan',color:{color:'#6c6f85'},width:4},
  {from:'virus-scan',to:'return-ready',color:{color:'#6c6f85'},width:4},
  {from:'data-delete',to:'return-ready',color:{color:'#6c6f85'},width:4},
  {from:'re-inspect',to:'return-ready',color:{color:'#6c6f85'},width:4},
  {from:'return-ready',to:'return-log',color:{color:'#6c6f85'},width:4},
  {from:'return-log',to:'report',color:{color:'#6c6f85'},width:4},
  {from:'virus-scan',to:'virus-detect',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'ウイルス検出'},
  {from:'re-inspect',to:'breakage',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'破損発見'},
  {from:'lost-theft',to:'trouble-report',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'紛失・盗難報告'},
  {from:'leak',to:'trouble-report',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'漏洩報告'},
  {from:'breakage',to:'trouble-report',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'破損報告'},
  {from:'virus-detect',to:'trouble-report',color:{color:'#6c6f85'},width:2.5,dashes:[3,3],label:'検出報告'},
  {from:'report',to:'process-end',color:{color:'#6c6f85'},width:4},
  {from:'trouble-report',to:'process-end',color:{color:'#6c6f85'},width:2,dashes:[6,4],label:'報告後終了'},
  {from:'process-end',to:'goal',color:{color:'#6c6f85'},width:4}]);
var container=document.getElementById('mynetwork');
var data={nodes:nodes,edges:edges};
var options={nodes:{borderWidth:2,font:{face:'Helvetica Neue,Arial,sans-serif'}},edges:{smooth:{type:'curvedCW',roundness:0.04}},physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-28,centralGravity:0.0001,springLength:200,springConstant:0.03,damping:0.2},maxVelocity:3,stabilization:{iterations:2000,updateInterval:50}},interaction:{dragNodes:true,dragView:true,zoomView:true,hover:true,tooltipDelay:300},layout:{improvedLayout:false}};
var network=new vis.Network(container,data,options);
network.on("stabilizationProgress",function(p){document.getElementById('info').innerHTML='安定化中... '+Math.round(p.iterations/options.physics.stabilization.iterations*100)+'%'});
network.once("stabilizationIterationsDone",function(){document.getElementById('info').innerHTML='社内PC持出要領'});
</script></body></html>
